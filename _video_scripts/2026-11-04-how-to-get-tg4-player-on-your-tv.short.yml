  title: How to Get TG4 Player on Your TV in Ireland
  description: |
    📺 TG4 Player is free to use, like RTÉ Player and Virgin Media Play, with no subscription or sign-up fee.

    💶 A TV licence (€160 a year per premises) applies to any TV in Ireland, including smart TVs used only for streaming apps.

    Setup varies by device:
    • Smart TVs (Samsung, LG) — search TG4 Player in the built-in app store
    • Fire TV — search and install from the Fire TV search icon
    • Android TV / Google TV — install via Google Play Store
    • Apple TV — install via the App Store
    • No app? Cast from your phone or tablet over Wi-Fi using Chromecast or AirPlay

    Check TG4's own supported-device list before you start, as app store listings can change.

