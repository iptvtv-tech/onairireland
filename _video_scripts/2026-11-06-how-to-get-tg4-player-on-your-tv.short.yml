youtube:
  title: How to Get TG4 Player on Your Smart TV in Ireland
  description: |
    📺 TG4 Player is a separate app from RTÉ Player, with its own live channel and catch-up shows including GAA and Ladies football. Both are free to use, but you need a TV licence for any TV you stream on.

    🔍 TG4 launched smart TV apps in 2021, but its own help page still lists them as coming soon, so search your TV's app store for TG4 before you buy.

    📱 There's a TG4 app for Apple TV (tvOS 26 or later). On Fire TV, Android TV and Google TV, search your device's app store.

    🔄 No app on your TV? Cast from the TG4 Player app or TG4 website on your phone or tablet using the cast icon.

