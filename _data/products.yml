# Product catalog for the affiliate "product showcase" cards.
#
# HOW THIS WORKS:
# Posts pull products automatically by category using:
#   {% raw %}{% include product-showcase.html category="Devices" %}{% endraw %}
# Update a product's link, price, or image here ONCE and it updates
# everywhere that category is shown across the whole site — you never
# need to hunt through individual post files to change a link.
#
# Fields:
#   id            - unique short slug, used internally
#   name          - product name shown on the card
#   category      - must match a post category: Streaming Services | Devices | Installation Guides
#   image         - path to a product image (add real images under assets/images/products/)
#   price         - display price, e.g. "€49.99" (TODO: keep current, Amazon prices change often)
#   badge         - optional short label shown on the card, e.g. "Best Seller", "Editor's Pick"
#   blurb         - one short sentence on why it's worth considering
#   affiliate_link - TODO: replace with your real Amazon Associates (or other) tracking link

