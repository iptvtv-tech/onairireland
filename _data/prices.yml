# Irish streaming prices — ONE place to update. Used by:
#   /streaming-prices/            (price tracker table)
#   /streaming-cost-calculator/   (calculator)
#
# Each plan:
#   service   - name shown to readers
#   plan      - plan name
#   monthly   - standard monthly price in euro (number). Leave out if not sold monthly.
#   yearly    - price per year in euro, if the service sells a yearly plan/pass
#   note      - optional short note (intro offers, what's included)
#   changed   - date the price last changed, if known (YYYY-MM-DD)
#   checked   - date WE last confirmed the price (YYYY-MM-DD)
#   source    - where it was confirmed
#   url       - link to that source
#   group     - general | film-tv | sport | free (used to group the table and calculator)
#   combinable - true if several plans of this service can be taken together (NOW memberships)
#
# When a price changes: update monthly/yearly, set changed + checked to today, update source.

