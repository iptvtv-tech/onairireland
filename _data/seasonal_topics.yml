# Seasonal topics by date window, read by scripts/inject_seasonal_topics.py
# (the "Inject Seasonal Topics" workflow: Mondays when it runs, or Run workflow).
#
# Two kinds of entry:
#   refresh: <file in _posts/>  The season's work is UPDATING that post from
#       primary sources (offers, dates, rights), prepared by hand (Claude makes
#       the patch, John reviews). Never queued for the draft bot: the writer has
#       no web access, and a second post on the same subject would compete with
#       the first (Google cut the site's visibility for overlapping posts in Oct
#       2026). check_posts.py fails if the file doesn't exist.
#   no refresh:  A NEW post, added to the front of _data/topic_queue.yml for
#       the draft bot. It is only drafted while the Daily Draft Post workflow runs.
#
# Prices, for every brief: regular prices come from _data/prices.yml (the
# price.html include, or [[price:...]] tokens in drafts), offers from
# _data/offers.yml (the offers.html include), and Amazon or other retailer
# prices are never typed (Amazon only allows live prices). check_posts.py
# fails a post that breaks this, whoever wrote it.
#
# window_start / window_end: MM-DD. Windows can wrap across New Year
#   (e.g. start 12-01, end 01-15 covers 1 Dec to 15 Jan).
#   Keep each window at least 7 days long so a Monday run always falls inside it.
# publish_by (new posts) is set to the window_end date, so the draft workflow
#   floats the topic to the top of the queue.
# {month} and {year} in title or brief are replaced with the month and year the
#   topic comes into season (e.g. "January 2027").
# Optional fields copied into the queue as-is: pillar, video, video_angle, whatsapp.

