# Seasonal topics, added to the front of _data/topic_queue.yml when their date
# window is active, by scripts/inject_seasonal_topics.py. The "Inject Seasonal
# Topics" workflow runs every Monday (and on demand) and opens a PR; nothing
# reaches the queue until that PR is merged.
#
# window_start / window_end: MM-DD. Windows can wrap across New Year
#   (e.g. start 12-01, end 01-15 covers 1 Dec to 15 Jan).
#   Keep each window at least 7 days long so a Monday run always falls inside it.
# publish_by is set automatically to the window_end date, so the daily draft
#   workflow floats the topic to the top of the queue.
# {month} and {year} in title or brief are replaced with the month and year the
#   topic is added (e.g. "January 2027"). Use them for recurring topics so each
#   one gets its own title and post.
# Optional fields copied into the queue as-is: pillar, video, video_angle, whatsapp.

# ---------------------------------------------------------------------------
# QUARTERLY SERVICE REVIEW — first two weeks of Jan, Apr, Jul and Oct.
# Do the quarterly fact check of _data/prices.yml and the hub pages in the same
# week, so the post and the price table agree.
# ---------------------------------------------------------------------------

- title: "Streaming in Ireland: Quarterly Review, {month} {year}"
  category: "Streaming Services"
  pillar: Price Watch
  brief: "A quarterly round-up for {month} {year}: what each legal streaming service in Ireland costs now, what changed in the last three months (price rises, new plans, channels added or dropped, offers ended) and which services are worth keeping. Check every price and plan on the provider's own Irish site and update _data/prices.yml in the same PR before publishing."
  window_start: "01-01"
  window_end: "01-14"

