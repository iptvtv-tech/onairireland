# Queue of topics for the daily auto-post GitHub Action.
# The workflow pops the FIRST item each run, generates a draft post from it,
# opens a PR, and removes it from this list once the PR is created.
#
# category must be one of: Streaming Services | Devices | Installation Guides |
# News | Reviews | Sports Streaming | Troubleshooting | Watch Guides
# (add a new category name here anytime -- Jekyll auto-generates its listing page,
# no other file needs to change. Just keep spelling consistent across posts.)
# Add new topics to the bottom of this list whenever you like.
#
# pillar:       Where to Watch | Service Guide | Device Setup | Price Watch | What's New
#               Content pillar the post and social copy belong to.
# publish_by:   YYYY-MM-DD — time-sensitive deadline. The workflow auto-floats
#               entries with a publish_by within the next 14 days to the top of
#               the queue so they are processed before evergreen topics.
# video:        true — this topic also produces a YouTube script (based on the blog post).
# video_angle:  One-line content steer for the video script.
# whatsapp:     false — suppress WhatsApp copy for this post (default: generated for all posts).

