# ==============================
# Site Settings
# ==============================
title: "On Air Ireland"
title_separator: "-"
name: "On Air Ireland"
subtitle: "Legal streaming services, devices & how-to guides for Ireland"
description: >-
  Your independent guide to legal streaming services in Ireland — service
  reviews, device recommendations, where to buy, and step-by-step
  installation instructions.
url: "https://onairireland.ie"
baseurl: ""
repository: "iptvtv-tech/onairireland"
locale: "en-IE"
lang: "en-IE"

# ==============================
# SEO / Social (jekyll-seo-tag)
# ==============================
logo: "/assets/images/logo.png"
image: "https://onairireland.ie/assets/images/social-home.jpg"
# Minimal Mistakes reads og_image (not image) for the default share image
og_image: "/assets/images/social-home.jpg"
twitter:
  username: onairireland
  card: summary_large_image
social:
  type: Organization
  name: On Air Ireland
  links:
    - "https://x.com/onairireland"
    # - "https://www.facebook.com/onairireland"
    # - "https://www.instagram.com/onairireland"

# Used by jekyll-seo-tag for author meta + JSON-LD
author:
  name: "On Air Ireland"
  bio: "Independent guides to legal streaming in Ireland."
  location: "Ireland"
  links:
    - label: "Twitter/X"
      icon: "fab fa-twitter"
      url: "https://x.com/onairireland"

# Newsletter signup forms (Brevo). Paste the form address from Brevo's embed
# code (the https://....sibforms.com/serve/... link) below, then set
# newsletter_enabled to true. While false, the site offers the two free PDF
# guides as direct downloads instead.
newsletter_enabled: true
newsletter_form_action: "https://648ad5f0.sibforms.com/v2/serve/MUIFABIopV6p8-BCW69hXoOg8-miFvv2vyijmZGEizenmvIFH5dG3bbrpAT3Tm4eunZbkJKC3m22m9Q1o0kFaddfIFi_mZ6XHZPAJn6-H3Rk3nZs23bSKX12SN7Y5bdxrPKXJFBrfnWbBH3DLZ0Yg51-ISkPdvbaqsHc1k_Yom2O6N9Z6Rvbd5yFMyXL__AaGd6La-kwcyO9hvFjtw=="

# WhatsApp Channel for match-day alerts. Create the channel in WhatsApp,
# copy its invite link (https://whatsapp.com/channel/...) and paste it here.
# The "Follow on WhatsApp" buttons stay hidden while this is empty.
whatsapp_channel_url: "https://whatsapp.com/channel/0029VbDvKAaEawdv3YeHxu2E"

google_site_verification: "tEtxNziR2i8q265EO-Oja9Ck-2A3hLFo175N7zNU6AE"
bing_site_verification: "C7C4370E4ACCFEEF2B837E2A5AC56296"

# ==============================
# Theme
# ==============================
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default" # options: default, air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise
# Adds the search (magnifying glass) button to the top menu
search: true
search_full_content: false

# ==============================
# Build settings
# ==============================
markdown: kramdown
highlighter: rouge
sass:
  style: compressed
permalink: /:categories/:title/
paginate: 10
paginate_path: /page:num/
timezone: Europe/Dublin

# Amazon Associates rules: only show prices pulled live from the Product
# Advertising API. Hand-typed prices are hidden while this is false.
show_prices: false

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-include-cache

future: true

# ==============================
# Reading Files
# ==============================
exclude:
  - "*.gemspec"
  - "*.gem"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts/
  - README.md

# ==============================
# Defaults
# ==============================
defaults:
  # Global SEO-friendly defaults for all posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      # share/related are off because every post already includes the custom
      # share-buttons.html and related-posts.html (avoids showing them twice)
      share: false
      related: false
      toc: true
      toc_sticky: true
      classes: wide
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

# ==============================
# Category definitions used across the site
# (Streaming Services, Devices, Installation Guides)
# ==============================
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# ==============================
# Analytics (optional)
# ==============================
analytics:
  # Keep provider false: Google Analytics is loaded by the cookie banner
  # (assets/js/cookie-consent.js) only after the visitor clicks Accept.
  provider: false
  google:
    tracking_id: "G-RF9TGJ9YJF"
    anonymize_ip: false

# ==============================
# Sitemap / Robots handled by jekyll-sitemap plugin automatically
# ==============================

