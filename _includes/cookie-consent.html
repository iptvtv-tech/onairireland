<!--
  Cookie consent banner. Analytics only loads after the visitor accepts.
  See README.md for usage.
-->
<div id="cookie-consent" class="cookie-consent" hidden>
  <p class="cookie-consent__text">
    We use cookies for analytics to understand how visitors use this site. Affiliate/retailer cookies are set separately when you click a product link. See our <a href="/privacy-policy/">Privacy Policy</a> for details.
  </p>
  <div class="cookie-consent__actions">
    <button type="button" id="cookie-accept" class="cookie-consent__btn cookie-consent__btn--accept">Accept</button>
    <button type="button" id="cookie-decline" class="cookie-consent__btn cookie-consent__btn--decline">Decline</button>
  </div>
</div>
