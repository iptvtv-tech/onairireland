name: Inject Seasonal Topics

# Runs every Monday (and on demand from the Actions tab). Checks today's date
# against _data/seasonal_topics.yml and, if any topic is in season, opens a PR
# adding it to the front of _data/topic_queue.yml. Nothing reaches the queue
# until that PR is merged. Merge it before the next Mon/Wed/Fri draft run if
# you want the topic drafted next.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Inject seasonal topics
        id: inject
        run: python scripts/inject_seasonal_topics.py

      # Fixed branch name: a re-run while the PR is still open updates that PR
      # instead of opening a duplicate. No PR is opened if nothing changed.
      - name: Open Pull Request
        if: steps.inject.outputs.added != ''
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add seasonal topics to the queue"
          branch: "auto/seasonal-topics"
          delete-branch: true
          add-paths: _data/topic_queue.yml
          title: "[Queue] Seasonal topics to add"
          body: |
            These in-season topics will be added to the front of `_data/topic_queue.yml`:

            ${{ steps.inject.outputs.added }}

            Merging this PR changes the queue only; nothing is published. The next Mon/Wed/Fri run drafts the first topic as its own PR.

            Before merging:
            - [ ] Each brief still makes sense this year (edit it in this PR if not)
            - [ ] Delete any topic you don't want this time
            ${{ contains(steps.inject.outputs.added, 'Quarterly Review') && '- [ ] Quarterly review: merge the `[Prices] Quarterly price check` PR first, and check the hub pages' || '' }}
          labels: |
            auto-queue
            needs-review
