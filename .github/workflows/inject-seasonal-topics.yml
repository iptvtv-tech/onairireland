name: Inject Seasonal Topics

# Manual-only trigger. Run this from the Actions tab whenever you want to
# check today's date against _data/seasonal_topics.yml and add any
# in-season topics to the front of the daily draft queue.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Inject seasonal topics
        run: python scripts/inject_seasonal_topics.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/topic_queue.yml
          git diff --staged --quiet || git commit -m "Inject seasonal topics"
          git push
