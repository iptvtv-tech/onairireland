name: Daily Draft Post

# Runs Mon/Wed/Fri (08:37 UTC, often hours later). Slower, properly fact-checked publishing beats volume.
on:
  schedule:
    # Off the hour on purpose: GitHub queues scheduled runs and often starts
    # them late (by hours lately), most of all at :00. Times are UTC.
    - cron: "37 8 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # One draft at a time. Draft, photo and seasonal-topic PRs all edit
      # _data/topic_queue.yml or _data/image_ledger.yml. A new draft opened
      # while one of them is still waiting re-drafts the same topic (PRs #97
      # and #98) or conflicts with it on merge, so skip this run instead.
      - name: Wait for open automation PRs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open=$(gh pr list --state open --limit 100 --json number,headRefName,title \
            --jq '.[] | select(.headRefName | test("^(auto-post/|auto-photos/|auto/seasonal-topics$)")) | "#\(.number) \(.title)"')
          if [ -n "$open" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### No draft this run"
              echo "These PRs change the topic queue or image ledger and are still open."
              echo "Merge or close them; the next Mon/Wed/Fri run (or Run workflow) then drafts the next topic."
              echo
              echo "$open"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Draft skipped::Still open: $(echo "$open" | tr '\n' ' ')"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install requests pyyaml pillow

      - name: Generate draft post
        if: steps.gate.outputs.skip != 'true'
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate_post.py

      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so the
      # front-matter check from check-pr.yml runs here too.
      - name: Check post front matter
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/check_posts.py

      - name: Open Pull Request
        if: success() && steps.gate.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Draft post: ${{ steps.generate.outputs.post_title }}"
          branch: "auto-post/${{ github.run_number }}"
          title: "[Draft] ${{ steps.generate.outputs.post_title }}"
          body: |
            Auto-generated draft. Merging this PR publishes it live.
            ${{ steps.generate.outputs.publish_by && format('> ⚠️ **Time-sensitive** — publish by {0}', steps.generate.outputs.publish_by) || '' }}

            ${{ steps.generate.outputs.fact_check || '> ⚠️ **The fact check didn''t run** — see the Actions log for this run, and check every service, price, date and channel by hand.' }}

            Before merging, check:
            - [ ] Every ❌ and ⚠️ line in the fact check is fixed, or confirmed on the provider's own site
            - [ ] Every other service, price, date and channel named is still correct today
            - [ ] Watch guides name the actual service and date, not just "check your apps"
            - [ ] No claims of first-hand testing or experience
            - [ ] Product links are relevant to this post (delete any that aren't)
            - [ ] Title and description read naturally; description under 160 characters
            - [ ] Add 1-2 links to related posts on this site
            - [ ] Click Approve and run, and wait for the check's green tick before merging

            ---

            ## 📣 Social drafts — copy, edit and schedule after merging

            ${{ steps.generate.outputs.has_social != 'true' && '> ⚠️ Social generation failed — check the Actions log for this run.' || '' }}

            ### X post
            ```
            ${{ steps.generate.outputs.x_post }}
            ```

            ### WhatsApp
            ```
            ${{ steps.generate.outputs.whatsapp_msg }}
            ```

            ${{ steps.generate.outputs.youtube_script_path && '### YouTube script' || '' }}
            ${{ steps.generate.outputs.youtube_script_path && format('See `{0}` in this PR.', steps.generate.outputs.youtube_script_path) || '' }}
          labels: |
            auto-draft
            needs-review
