name: Daily Draft Post

# Runs once a week, Wednesday (08:37 UTC, often hours later). Cut from Mon/Wed/Fri on 10 Nov 2026
# after Google stopped showing most of the site (27 Oct): fewer, stronger posts while it recovers.
on:
  schedule:
    # Off the hour on purpose: GitHub queues scheduled runs and often starts
    # them late (by hours lately), most of all at :00. Times are UTC.
    - cron: "37 8 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # One draft at a time. Draft, photo and seasonal-topic PRs all edit
      # _data/topic_queue.yml or _data/image_ledger.yml. A new draft opened
      # while one of them is still waiting re-drafts the same topic (PRs #97
      # and #98) or conflicts with it on merge, so skip this run instead.
      - name: Wait for open automation PRs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open=$(gh pr list --state open --limit 100 --json number,headRefName,title \
            --jq '.[] | select(.headRefName | test("^(auto-post/|auto-photos/|auto/seasonal-topics$)")) | "#\(.number) \(.title)"')
          if [ -n "$open" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### No draft this run"
              echo "These PRs change the topic queue or image ledger and are still open."
              echo "Merge or close them; the next Wednesday run (or Run workflow) then drafts the next topic."
              echo
              echo "$open"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Draft skipped::Still open: $(echo "$open" | tr '\n' ' ')"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install requests pyyaml pillow

      - name: Generate draft post
        if: steps.gate.outputs.skip != 'true'
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate_post.py

      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so the
      # front-matter check from check-pr.yml runs here too.
      - name: Check post front matter
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/check_posts.py

      # A draft PR only opens once the claims list flags nothing: generate_post.py
      # rewrites and rechecks the draft until it does, or parks the topic and
      # tries the next one. If the fact check itself can't run, that step fails
      # and no PR opens.
      - name: Open Pull Request
        if: success() && steps.gate.outputs.skip != 'true' && steps.generate.outputs.parked_only != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Draft post: ${{ steps.generate.outputs.post_title }}"
          branch: "auto-post/${{ github.run_number }}"
          title: "[Draft] ${{ steps.generate.outputs.post_title }}"
          body: |
            Auto-generated draft. Merging this PR publishes it live.
            ${{ steps.generate.outputs.publish_by && format('> ⚠️ **Time-sensitive** — publish by {0}', steps.generate.outputs.publish_by) || '' }}

            ${{ steps.generate.outputs.fact_check }}

            Every claim in the article, FAQ and social drafts passed the fact check, so there's nothing to confirm. Before merging:
            - [ ] Read it through: it makes sense, and the title and description read naturally
            - [ ] Product links fit this post (delete any that don't)
            - [ ] Click Approve and run, and wait for the check's green tick before merging

            ---

            ## 📣 Social drafts — copy, edit and schedule after merging

            ${{ steps.generate.outputs.has_social != 'true' && '> ⚠️ Social generation failed — check the Actions log for this run.' || '' }}

            ### X post
            ```
            ${{ steps.generate.outputs.x_post }}
            ```

            ### WhatsApp
            ```
            ${{ steps.generate.outputs.whatsapp_msg }}
            ```

            ${{ steps.generate.outputs.youtube_script_path && '### YouTube script' || '' }}
            ${{ steps.generate.outputs.youtube_script_path && format('See `{0}` in this PR.', steps.generate.outputs.youtube_script_path) || '' }}

            ${{ steps.generate.outputs.short_path && '### 🎬 YouTube Short' || '' }}
            ${{ steps.generate.outputs.short_path && format('The Short''s scenes, voiceover, title, description and tags are in `{0}`. Check them against the article (the claims list above covers them too). After merging, the **YouTube Short** workflow renders the video and comments here with a link to download the MP4 and the ready-to-paste upload text.', steps.generate.outputs.short_path) || '' }}
            ${{ steps.generate.outputs.short_failed && format('> ⚠️ The YouTube Short wasn''t written ({0}). After merging, run `python scripts/generate_short.py <post>` or ask Claude.', steps.generate.outputs.short_failed) || '' }}
          labels: |
            auto-draft
            needs-review

      # No topic passed the fact check: this PR only moves them from the queue to
      # _data/topic_parked.yml. auto-post/ branch, so draft runs wait for it.
      - name: Open Pull Request (topics parked, no draft)
        if: success() && steps.gate.outputs.skip != 'true' && steps.generate.outputs.parked_only == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Topic queue: park topics that couldn't pass the fact check"
          branch: "auto-post/${{ github.run_number }}"
          title: "[Queue] ${{ steps.generate.outputs.post_title }}"
          body: |
            ${{ steps.generate.outputs.parked_summary }}
          labels: |
            auto-draft
